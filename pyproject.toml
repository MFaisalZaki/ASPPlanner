[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aspplanner"
version = "0.1.0"
description = "Lightweight planner using Answer Set Programming (ASP)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mustafa Faisal Zaki", email = "mustafa.faisal.eng@gmail.com"}
]
maintainers = [
    {name = "Mustafa Faisal Zaki", email = "mustafa.faisal.eng@gmail.com"}
]
keywords = [
    "answer-set-programming",
    "asp", 
    "planning",
    "aspplanner",
    "clingo",
    "artificial-intelligence"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = [
    "clingo>=5.6.0",
    "unified-planning>=1.1.0",
    "up_fast_downward>=0.5.2"
]

[project.optional-dependencies]

# The ABAPlan backend (aspplanner.abaplan) solves via aspforaba; it is optional
# so the default PLASP planner installs without the Bitbucket git dependency.
aba = [
    "aspforaba @ git+https://bitbucket.org/coreo-group/aspforaba.git"
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "aspforaba @ git+https://bitbucket.org/coreo-group/aspforaba.git"
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0"
]

[project.urls]
Homepage = "https://github.com/MFaisalZaki/ASPPlanner"
Repository = "https://github.com/MFaisalZaki/ASPPlanner"
Issues = "https://github.com/MFaisalZaki/ASPPlanner/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["aspplanner*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"aspplanner.plasp" = [
    "encodings/*.lp",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Kept intentionally lenient: the codebase is only partially annotated.
# Tighten (disallow_untyped_defs etc.) as annotations grow.
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["aspplanner"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]