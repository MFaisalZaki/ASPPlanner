[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aspbench"
version = "0.1.0"
description = "Benchmark harness for the ASPPlanners backends (classical, numeric, temporal)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mustafa Faisal Zaki", email = "mustafa.faisal.eng@gmail.com"}
]
requires-python = ">=3.10"

# Deliberately dependency-free. `generate` and `analyze` run on stdlib alone so
# commands can be produced anywhere; `solve` needs `aspplanners` (and through it
# unified-planning), which is installed from the repository root next to this
# one -- pinning it here would mean duplicating that editable install.
dependencies = []

[project.optional-dependencies]
# Only `aspbench report`'s figures need this; its tables run on stdlib alone
# (`--no-plots`), so the harness stays installable on a bare compute node.
plots = ["matplotlib>=3.6"]

[project.scripts]
aspbench = "aspbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aspbench*"]
